services:
  mongo:
    image: mongo:8
    # CPU caps keep load numbers repeatable on a shared laptop; total 3.5 of the host's 8 cores.
    # Sized from 3-min runs at 167/s (Mongo avg 43-60%, api/worker peaks under 50%); spikes above the cap get throttled.
    cpus: 1.5
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    cpus: 0.5
    ports:
      - '3000:3000'
    environment:
      MONGO_URI: mongodb://mongo:27017/ingest
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: node dist/worker.js
    # Per replica.
    cpus: 0.5
    environment:
      MONGO_URI: mongodb://mongo:27017/ingest
    deploy:
      replicas: 2
    restart: unless-stopped
    # Above the worker's 10s drain, so SIGKILL never cuts a drain short.
    stop_grace_period: 15s
    depends_on:
      mongo:
        condition: service_healthy

  # Load generator, only for npm run load; on the compose network, so it reaches the api by name.
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: 0.5
    volumes:
      - ./load:/load
    environment:
      - DURATION
      - RATE
    command: >-
      run --summary-export /load/summary.json --log-format raw
      --console-output /load/accepted.log /load/load.js

volumes:
  mongo-data:
