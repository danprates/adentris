# Fixed name: the chaos service runs `docker compose` from inside a container, where the folder name differs.
name: adentris

services:
  mongo:
    image: mongo:8
    # CPU caps keep load numbers repeatable on a shared laptop; total 3.5 of the host's 8 cores.
    # Sized from 3-min runs at 167/s (Mongo avg 43-60%, api/worker peaks under 50%); spikes above the cap get throttled.
    cpus: 1.5
    ports:
      # Loopback only: Mongo runs without auth, and only the e2e tests on this machine need the port.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    cpus: 0.5
    ports:
      # Loopback only: the api has no auth and takes patient data; k6 reaches it on the compose network.
      - '127.0.0.1:3000:3000'
    environment:
      MONGO_URI: mongodb://mongo:27017/ingest
      PORT: 3000
      # shortcut: a dev key in the file; production injects its own secret, the same for api and worker.
      LOG_HASH_KEY: ${LOG_HASH_KEY:-dev-only-log-hash-key}
    # The api keeps no state, so a crashed one comes back on its own; senders retry what it dropped.
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/health']
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      mongo:
        condition: service_healthy

  worker:
    build: .
    command: node dist/worker.js
    # Per replica.
    cpus: 0.5
    environment:
      MONGO_URI: mongodb://mongo:27017/ingest
      LOG_HASH_KEY: ${LOG_HASH_KEY:-dev-only-log-hash-key}
    deploy:
      replicas: 2
    restart: unless-stopped
    # Above the worker's 10s drain, so SIGKILL never cuts a drain short.
    stop_grace_period: 15s
    depends_on:
      mongo:
        condition: service_healthy

  # The load profile runs the whole load test: reset, k6, chaos and verify, in that order.
  # Clears the events and the previous k6 output, so verify compares this run only.
  reset:
    image: mongo:8
    profiles: [load]
    volumes:
      - ./load:/load
    command: >-
      sh -c 'rm -f /load/summary.json /load/accepted.log &&
      mongosh --quiet mongodb://mongo:27017/ingest --eval "db.events.deleteMany({})"'
    depends_on:
      mongo:
        condition: service_healthy

  # Load generator; on the compose network, so it reaches the api by name.
  k6:
    image: grafana/k6:1.3.0
    profiles: [load]
    cpus: 0.5
    volumes:
      - ./load:/load
    environment:
      - DURATION
    # Exits 0 even when a latency threshold fails (it prints ✗), so verify always checks the data.
    entrypoint:
      - sh
      - -c
      - >-
        k6 run --summary-export /load/summary.json --log-format raw
        --console-output /load/accepted.log /load/load.js || true
    depends_on:
      reset:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      worker:
        condition: service_started

  # SIGKILLs one worker halfway through the load; needs the Docker socket to reach the worker's process.
  # The socket and --pid=host give root on the Docker VM: local load runs only.
  chaos:
    image: docker:27.5.1-cli
    profiles: [load]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/work
    working_dir: /work
    environment:
      - DURATION
      - CHAOS_DELAY_S
    command: sh load/chaos.sh
    depends_on:
      k6:
        condition: service_started

  # Waits for the queue to drain, then checks nothing was lost, duplicated or applied out of order.
  verify:
    build: .
    profiles: [load]
    volumes:
      - ./load:/app/load
    environment:
      MONGO_URI: mongodb://mongo:27017/ingest
    command: node load/verify.mts --final
    depends_on:
      k6:
        condition: service_completed_successfully
      chaos:
        condition: service_completed_successfully

volumes:
  mongo-data:
